    <style>
      #jsp-langbar { position: fixed; top: 6px; right: 10px; z-index: 9999;
        font: 12px/1.6 system-ui, sans-serif; opacity: .75; }
      #jsp-langbar:hover { opacity: 1; }
      .jsp-lang { display: inline-block; padding: 2px 8px; margin-left: 4px;
        border: 1px solid currentColor; border-radius: 3px;
        text-decoration: none; color: inherit; }
      .jsp-lang-on { opacity: .5; border-style: dashed; }
    </style>
    <div id="jsp-langbar"><span class="jsp-lang jsp-lang-on">日本語</span><a class="jsp-lang" href="zh/index.html" data-lang="zh">中文</a></div>
    <script>
      // 選んだ言語を覚えておき、次に入口へ来たときはそちらへ送る。
      // 「いま zh にいるのに ja へ飛ばす」ことが無いよう、
      // 移動するのは記憶と今いる場所が食い違うときだけにする。
      (function () {
        var HERE = "ja";
        var KEY = 'jsp-lang';
        try {
          var saved = localStorage.getItem(KEY);
          var links = document.querySelectorAll('a.jsp-lang');
          for (var i = 0; i < links.length; i++) {
            links[i].addEventListener('click', function () {
              try { localStorage.setItem(KEY, this.getAttribute('data-lang')); } catch (e) {}
            });
          }
          if (saved && saved !== HERE && !sessionStorage.getItem(KEY + '-moved')) {
            for (var j = 0; j < links.length; j++) {
              if (links[j].getAttribute('data-lang') === saved) {
                sessionStorage.setItem(KEY + '-moved', '1');
                location.replace(links[j].getAttribute('href'));
                return;
              }
            }
          }
          if (!saved) { localStorage.setItem(KEY, HERE); }
        } catch (e) {}
      }());
    </script>
